name: pad-notes-android

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    paths:
      - "pad-notes-android/**"
      - ".github/workflows/pad-notes-android.yml"
  push:
    branches: [main]
    paths:
      - "pad-notes-android/**"
      - ".github/workflows/pad-notes-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pad-notes-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pad-notes-android-debug-apk
          path: pad-notes-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pad-notes-android-reports
          path: |
            pad-notes-android/app/build/reports/**
            pad-notes-android/app/build/test-results/**

  screenshots:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'android-screenshots')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ADB: /usr/local/lib/android/sdk/platform-tools/adb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK components
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" "emulator" "system-images;android-30;default;x86_64"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: pad-notes-android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator
        run: |
          AVDMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/avdmanager | head -1)
          echo no | "$AVDMANAGER" create avd -n suimo_tablet -k "system-images;android-30;default;x86_64" -d pixel_tablet --force
          "$ANDROID_HOME/emulator/emulator" -avd suimo_tablet -no-window -no-audio -no-boot-anim             -gpu swiftshader_indirect -camera-back none -camera-front none > /tmp/emulator.log 2>&1 &
          "$ADB" wait-for-device
          for i in $(seq 1 150); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "booted after $((i * 2))s"
              break
            fi
            sleep 2
          done
          "$ADB" shell input keyevent 82 || true
          "$ADB" shell wm size
          "$ADB" shell wm density
      - name: Capture screenshots
        run: bash pad-notes-android/scripts/capture-screens.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pad-notes-android-screenshots
          path: pad-notes-android/docs/screenshots/*.png
          if-no-files-found: warn
      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pad-notes-android-emulator-log
          path: /tmp/emulator.log
          if-no-files-found: warn
      - name: Commit screenshots back to the PR branch
        if: always()
        run: |
          git config user.name "tys-work"
          git config user.email "351982172+tys-work@users.noreply.github.com"
          git add pad-notes-android/docs/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi
          git commit -m "docs(pad-notes-android): update emulator screenshots [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
