name: pad-notes-android

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    paths:
      - "pad-notes-android/**"
      - ".github/workflows/pad-notes-android.yml"
  push:
    branches: [main]
    paths:
      - "pad-notes-android/**"
      - ".github/workflows/pad-notes-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pad-notes-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pad-notes-android-debug-apk
          path: pad-notes-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pad-notes-android-reports
          path: |
            pad-notes-android/app/build/reports/**
            pad-notes-android/app/build/test-results/**

  screenshots:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'android-screenshots')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ADB: /usr/local/lib/android/sdk/platform-tools/adb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK components
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" "emulator"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: pad-notes-android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot tablet emulator and capture the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash pad-notes-android/scripts/capture-screens.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pad-notes-android-screenshots
          path: pad-notes-android/docs/screenshots/*.png
          if-no-files-found: warn
      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pad-notes-android-emulator-log
          path: /tmp/emulator.log
          if-no-files-found: warn
      - name: Commit screenshots back to the PR branch
        if: always()
        run: |
          git config user.name "tys-work"
          git config user.email "351982172+tys-work@users.noreply.github.com"
          git add pad-notes-android/docs/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi
          git commit -m "docs(pad-notes-android): update emulator screenshots [skip ci]" \
            -m "Co-authored-by: tys-T <181165180+tys-T@users.noreply.github.com>"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
